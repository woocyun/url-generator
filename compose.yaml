name: url-generator

# The API image serves two roles — the long-running server and the one-shot
# migration job (ADR 0006) — so its build and its database wiring are defined
# once here and referenced by both services.
x-api-build: &api-build
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: dev
  image: url-generator-api:dev
  volumes:
    # Bind-mount the workspace for hot reload, but keep the container's own
    # node_modules: the host tree may be absent or built for a different
    # platform.
    - .:/app
    - /app/node_modules

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:-urlshortener}@postgres:5432/${POSTGRES_DB:-urlshortener}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urlshortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urlshortener}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
      # Set explicitly so the volume mount path does not depend on the default
      # PGDATA of a given Postgres major version.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-urlshortener} -d ${POSTGRES_DB:-urlshortener}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Applies pending migrations and exits. The API waits on it completing
  # successfully, so the schema is never behind the code that queries it, and a
  # broken migration stops the stack here instead of surfacing as runtime
  # errors. Idempotent: re-running it on an up-to-date database is a no-op.
  migrate:
    <<: *api-build
    restart: "no"
    environment:
      NODE_ENV: development
      <<: *database-url
    command: ["npm", "run", "db:migrate", "--workspace", "@url-generator/api"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-build
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      <<: *database-url
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WEB_PORT: 3000
      # Server components talk to the API over the compose network.
      API_INTERNAL_URL: http://api:4000
      # The browser reaches it through the published port on the host.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  postgres-data:
