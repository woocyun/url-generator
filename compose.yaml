name: url-generator

# The API image serves two roles — the long-running server and the one-shot
# migration job (ADR 0006) — so its build and its database wiring are defined
# once here and referenced by both services.
x-api-build: &api-build
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: dev
  image: url-generator-api:dev
  volumes:
    # Bind-mount the workspace for hot reload, but keep the container's own
    # node_modules: the host tree may be absent or built for a different
    # platform.
    - .:/app
    - /app/node_modules

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-urlshortener}:${POSTGRES_PASSWORD:-urlshortener}@postgres:5432/${POSTGRES_DB:-urlshortener}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urlshortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urlshortener}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
      # Set explicitly so the volume mount path does not depend on the default
      # PGDATA of a given Postgres major version.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-urlshortener} -d ${POSTGRES_DB:-urlshortener}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The read path's cache (ADR 0009). Configured as a cache and not as a
  # database, which is the whole reason it is safe to lose:
  #
  #   --save "" / --appendonly no  no persistence. Every key is reconstructible
  #                                from Postgres, so writing them to disk buys
  #                                a warm restart at the cost of fsyncs on the
  #                                hot path and a file that can go stale.
  #   --maxmemory                  a bound, so a scanner walking the code space
  #                                cannot grow this container until something
  #                                on the host dies.
  #   allkeys-lru                  evict rather than refuse writes when full.
  #                                An evicted key is a cache miss, which the
  #                                read path already handles; a write that
  #                                errors is a link that never gets cached.
  #
  # There is deliberately no volume: a cold cache is a slow minute, not data
  # loss, and `docker compose down -v` should not be the only way to clear it.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Applies pending migrations and exits. The API waits on it completing
  # successfully, so the schema is never behind the code that queries it, and a
  # broken migration stops the stack here instead of surfacing as runtime
  # errors. Idempotent: re-running it on an up-to-date database is a no-op.
  migrate:
    <<: *api-build
    restart: "no"
    environment:
      NODE_ENV: development
      <<: *database-url
    command: ["npm", "run", "db:migrate", "--workspace", "@url-generator/api"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-build
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      REDIS_URL: redis://redis:6379
      # Both empty by default, which `env.ts` reads as unset: links are
      # permanent unless a caller asks otherwise, and there is no ceiling on
      # what they may ask for. A deployment with a retention policy fills these
      # in (ADR 0011).
      DEFAULT_LINK_TTL_SECONDS: ${DEFAULT_LINK_TTL_SECONDS:-}
      MAX_LINK_TTL_SECONDS: ${MAX_LINK_TTL_SECONDS:-}
      <<: *database-url
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # `service_started`, not `service_healthy`, and the difference is the
      # point: the API must be able to boot without a working cache, because
      # that is the state it has to survive in production (ADR 0009). Waiting
      # on Redis here would make a dependency out of the one component the read
      # path is designed not to need — and would mean a Redis that fails to
      # start takes the whole stack with it.
      redis:
        condition: service_started

  # Deletes links that expired longer than EXPIRY_RETENTION_SECONDS ago, on an
  # interval (ADR 0011). Its own service rather than a timer inside the API for
  # the reasons in `src/expiry/run.ts`: the API's connection pool belongs to the
  # read path, one sweeper is enough however many API replicas there are, and a
  # background job you can stop without stopping the API is a job you can stop
  # during an incident.
  #
  # Nothing about expiry depends on this running. `GET /{code}` refuses an
  # expired link whether or not the row is still there, so a sweeper that is
  # down means a table that grows and aliases that stay locked up — not links
  # that come back to life. It gets `restart: unless-stopped` all the same,
  # because a job that quietly stops running is the failure mode worth guarding.
  #
  # It waits on migrate for the partial index it queries through, and starts
  # alongside Redis rather than behind it: the entries it invalidates are an
  # optimization, and a cache that is down turns each one into a no-op.
  sweep:
    <<: *api-build
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      EXPIRY_RETENTION_SECONDS: ${EXPIRY_RETENTION_SECONDS:-604800}
      EXPIRY_SWEEP_INTERVAL_SECONDS: ${EXPIRY_SWEEP_INTERVAL_SECONDS:-300}
      EXPIRY_SWEEP_BATCH_SIZE: ${EXPIRY_SWEEP_BATCH_SIZE:-500}
      # One connection is all a serial batch loop uses; the default of 10 would
      # be nine sessions held open to run one DELETE at a time.
      DATABASE_POOL_MAX: 2
      <<: *database-url
    command: ["npm", "run", "db:sweep", "--workspace", "@url-generator/api"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WEB_PORT: 3000
      # Server components talk to the API over the compose network.
      API_INTERNAL_URL: http://api:4000
      # The browser reaches it through the published port on the host.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  postgres-data:
